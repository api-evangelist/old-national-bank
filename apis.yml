name: Old National Bank
kind: company
description: >-
  Old National Bank is a nationally chartered, FDIC-insured regional commercial
  bank and the primary subsidiary of Old National Bancorp (NASDAQ: ONB),
  headquartered in Evansville, Indiana and Chicago, Illinois. With roughly $73
  billion in assets and nearly 200 retail branches across Illinois, Indiana,
  Iowa, Kentucky, Michigan, Minnesota, Tennessee, and Wisconsin, it is one of
  the largest commercial banks headquartered in the U.S. Midwest, offering
  consumer, small business, commercial, treasury management, and wealth banking.
  Old National does not operate a first-party public developer portal or publish
  any downloadable OpenAPI/Swagger specifications; probes of developer., api.,
  and apis.oldnational.com do not resolve and /developers returns HTTP 404.
  Consumer-permissioned account and transaction data is instead reached through
  third-party financial data aggregators (Finicity by Mastercard is documented),
  which is the honest, aggregator-only open-finance posture typical of U.S.
  regional banks. No documented first-party FDX-conformant data-access API or
  published CFPB Section 1033 developer surface was found at review time.
