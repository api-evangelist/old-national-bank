actions:
  apisYmlUpdated: true
  openapiHarvested: false
  reason: |
    No first-party public API surface exists to model. apis[] is left empty
    (honest) and the record is an identity-only / aggregator-only stub. If Old
    National later stands up a developer portal, publishes an FDX/1033 data-
    access API, or exposes downloadable OpenAPI, re-review and harvest verbatim.
